name: Godot project check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out project and LFS assets
        uses: actions/checkout@v5
        with:
          lfs: true
          persist-credentials: false

      - name: Download pinned standard Godot
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"

      - name: Import and smoke check
        shell: pwsh
        run: ./tools/check_project.ps1 -GodotPath "$env:RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
